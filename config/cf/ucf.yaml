    dynamic_k: false
    dynamic_top_k: 40
    gamma: 0.5
    mode: balance
    radius: 2.5
    scale_box_loss: 7.5
    scale_cls_loss: 0.5
    scale_dfl_loss: 1.5
    soft_label: true
    top_k: 10
  TAL:
