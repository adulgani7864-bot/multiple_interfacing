    width_mult: 2.0
LOSS:
  NORMAL:
    dynamic_k: true
    dynamic_top_k: 10
    radius: 2.5
    scale_box_loss: 5.0
    scale_cls_loss: 1.0
    scale_dfl_loss: 1.0
    top_k: 10
